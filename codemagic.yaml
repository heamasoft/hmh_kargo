# Codemagic CI/CD — builds the iOS app and publishes it to TestFlight / App Store.
#
# One-time setup in Codemagic (Teams → Integrations, and app settings):
#   1. Connect this GitHub repo.
#   2. Add an "App Store Connect" integration using the API key you generated:
#        - Issuer ID, Key ID, and the downloaded .p8 file.
#      Name that integration reference below (here: "HMH_ASC_API_KEY").
#   3. iOS code signing → "Automatic" → pick the App Store Connect API key.
#      Bundle identifier: com.hmhkargo.app
#
# Then just push to `main` (or run the workflow manually) and Codemagic builds,
# signs, and uploads the build to TestFlight.

workflows:
  ios-appstore:
    name: HMH Kargo — iOS (App Store)
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Build automatically on every push to main (needs the app's GitHub webhook,
    # which Codemagic adds when the repo is connected).
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    integrations:
      app_store_connect: HMH_ASC_API_KEY   # <-- must match the integration name in Codemagic
    cache:
      cache_paths:
        # CocoaPods spec index and the resolved Pods — without these every build
        # re-downloads the whole index, which is the slow "Install CocoaPods
        # dependencies" step (10-20 min cold, under a minute cached).
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.cocoapods/repos
        - $FCI_BUILD_DIR/ios/Pods
        - $HOME/.pub-cache
    environment:
      vars:
        BUNDLE_ID: "com.hmhkargo.app"
        APP_STORE_APPLE_ID: 6802223643       # HMH Kargo — Apple ID (App Store Connect → App Information)
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      # Flutter upgrades ios/Runner.xcodeproj on its own (deployment target, Swift
      # Package Manager, the UIScene migration). Doing that here means the Xcode
      # project is already in its final shape BEFORE the signing settings are
      # written into it — otherwise the build rewrites the project and throws the
      # certificate and profile away ("No valid code signing certificates found").
      - name: Prepare the Xcode project (Flutter migrations)
        script: flutter build ios --release --config-only --no-codesign
      - name: Install CocoaPods dependencies
        script: |
          # Only the app's own Podfile — a bare `find` also walks into the
          # plugin sample projects and installs pods the app never uses.
          cd ios && pod install
      - name: Set up code signing (create cert + profile)
        script: |
          keychain initialize
          # fetch-signing-files --create needs a PRIVATE KEY to generate the new
          # distribution certificate — without it you get "Cannot save Signing
          # Certificates without certificate private key". Generate one, then it
          # creates the certificate + App Store profile and keeps the pair to sign.
          CERT_KEY="$HOME/ios_distribution_key.pem"
          ssh-keygen -t rsa -b 2048 -m PEM -f "$CERT_KEY" -q -N ""
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:"$CERT_KEY" \
            --create
          keychain add-certificates
          xcode-project use-profiles
          # Stop here with a readable reason instead of failing deep inside Xcode.
          security find-identity -v -p codesigning
          if security find-identity -v -p codesigning | grep -qE '^ +0 valid identities found'; then
            echo "No signing certificate reached the keychain."
            echo "Most likely the Apple account already has the maximum number of"
            echo "distribution certificates — revoke the unused ones at"
            echo "https://developer.apple.com/account/resources/certificates and rebuild."
            exit 1
          fi
      - name: Flutter analyze
        script: flutter analyze || true
      - name: Flutter build ipa
        script: |
          # The version (e.g. 1.0.2) comes from pubspec.yaml; only the build
          # number is set here, one above the latest on TestFlight.
          flutter build ipa --release \
            --build-number=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0) + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Flip to true + add release settings when you're ready for the public App Store.
        submit_to_app_store: false
